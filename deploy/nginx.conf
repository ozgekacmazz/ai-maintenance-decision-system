worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout combined;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    map $uri $response_cache_control {
        ~^/api/ "";
        ~^/assets/ "public, max-age=31536000, immutable";
        default "no-cache";
    }
    map $http_x_forwarded_proto $trusted_forwarded_proto {
        default $scheme;
        https https;
    }

    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;

    upstream backend_upstream { server backend:8000; }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $response_cache_control always;

        location = /proxy-health {
            access_log off;
            default_type text/plain;
            return 200 "ready\n";
        }

        location = /api/auth/login/ {
            limit_req zone=login_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_read_timeout 120s;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;
            return 429 '{"hata":{"kod":"ISTEK_SINIRI","mesaj":"Çok fazla giriş denemesi. Lütfen kısa süre sonra tekrar deneyin."}}';
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location = /index.html { }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. { deny all; }
    }
}
