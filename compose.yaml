services:
  db:
    image: postgres:17-alpine
    container_name: sensor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sensor-backend
    env_file: .env
    environment:
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-/opt/ml/artifacts/binary-failure-1.0.0.joblib}
      MODEL_METADATA_PATH: ${MODEL_METADATA_PATH:-/data/metadata/binary_failure_model.json}
      FAILURE_TYPE_MODEL_ARTIFACT_PATH: ${FAILURE_TYPE_MODEL_ARTIFACT_PATH:-/opt/ml/artifacts/failure-type-1.0.0.joblib}
      FAILURE_TYPE_MODEL_METADATA_PATH: ${FAILURE_TYPE_MODEL_METADATA_PATH:-/data/metadata/failure_type_model.json}
      SHAP_TOP_N: ${SHAP_TOP_N:-3}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./ml:/opt/ml:ro
      - ./data/metadata:/data/metadata:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sensor-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
