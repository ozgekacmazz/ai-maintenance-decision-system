[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-projesi-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
